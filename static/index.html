<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Light Identifier</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5b6675; --line:#d9dee6; --accent:#2457d6;
          --info:#2457d6; --caution:#b36b00; --warning:#c0262d; --unsure:#7a6a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8ecf2; --muted:#9aa5b5; --line:#2c3541; --accent:#6f9bff;
            --info:#6f9bff; --caution:#f0b04a; --warning:#ff6b73; --unsure:#d8c85a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=file] { max-width:100%; }
  img#photo { max-width:100%; border-radius:8px; display:block; }
  .light h3 { margin:0 0 2px; font-size:1.05rem; }
  .chip { display:inline-block; font-size:.75rem; border:1px solid currentColor; border-radius:99px; padding:0 8px; margin-left:6px; }
  .info { color:var(--info); } .caution { color:var(--caution); } .warning { color:var(--warning); } .unsure { color:var(--unsure); }
  .muted { color:var(--muted); font-size:.9rem; }
  #error { color:var(--warning); }
</style>
</head>
<body>
<main>
  <h1>Dashboard Light Identifier</h1>
  <p class="sub">Upload a clear, straight photo of your instrument cluster with the lights on. The app finds each lit light and names it, or says it is unsure.</p>

  <div class="card">
    <input id="file" type="file" accept="image/*">
    <button id="go" disabled>Identify lights</button>
    <p id="status" class="muted"></p>
    <p id="error"></p>
  </div>

  <div id="result" hidden>
    <div class="card"><img id="photo" alt="Your photo with numbered boxes around each light found"></div>
    <div id="lights"></div>
  </div>

  <p class="muted" id="note"></p>
  <p class="muted">Privacy: your photo is processed in memory and is not saved by this app. This is a portfolio project, not a safety tool.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("file").addEventListener("change", () => { $("go").disabled = !$("file").files.length; });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;       // textContent, never innerHTML: nothing from the server is run as code
  return e;
}

$("go").addEventListener("click", async () => {
  const file = $("file").files[0];
  if (!file) return;
  $("go").disabled = true; $("error").textContent = ""; $("status").textContent = "Analyzing...";
  $("result").hidden = true;
  const form = new FormData(); form.append("file", file);
  try {
    const res = await fetch("/analyze", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong.");
    show(data);
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = "";
    $("error").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
});

function show(data) {
  $("photo").src = data.image;
  const box = $("lights"); box.replaceChildren();
  if (!data.lights.length) {
    const c = el("div", "card"); c.append(el("p", "", "I could not find any lit lights. Try a closer, sharper photo with the lights on."));
    box.append(c);
  }
  for (const l of data.lights) {
    const c = el("div", "card light");
    if (l.status === "identified" && l.meaning) {
      const h = el("h3", l.meaning.severity, `${l.id}. ${l.meaning.name}`);
      h.append(el("span", "chip " + l.meaning.severity, l.meaning.severity));
      c.append(h, el("p", "", l.meaning.summary), el("p", "", "What to do: " + l.meaning.what_to_do),
               el("p", "muted", `Confidence ${Math.round(l.confidence * 100)}%`));
    } else {
      c.append(el("h3", "unsure", `${l.id}. Unsure`),
               el("p", "", "A bright spot is here, but I am not confident what it is. Check your owner's manual."),
               el("p", "muted", `Closest guess: ${l.best_guess === "none" ? "not a known light" : l.best_guess} (${Math.round(l.confidence * 100)}%)`));
    }
    box.append(c);
  }
  $("note").textContent = data.note;
  $("result").hidden = false;
}
</script>
</body>
</html>
